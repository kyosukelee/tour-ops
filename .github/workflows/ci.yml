name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: 型チェック
        run: npm run typecheck
      - name: テスト(PGliteでマイグレーションとデモデータも検証)
        run: npm test
      - name: スキーマとマイグレーションのずれを確認
        run: npx drizzle-kit check
      - name: ビルド
        run: npm run build
