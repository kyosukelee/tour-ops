name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: 型チェック
        run: npm run typecheck
      - name: テスト(PGliteでマイグレーションとデモデータも検証)
        run: npm test
      - name: スキーマとマイグレーションのずれを確認
        run: npx drizzle-kit check
      - name: ビルド
        run: npm run build

  # 画面テスト: 本番ビルドを起動し、テスト用の Postgres に対して本物のブラウザで操作する
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tour_ops
          POSTGRES_PASSWORD: tour_ops
          POSTGRES_DB: tour_ops_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tour_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://tour_ops:tour_ops@localhost:5432/tour_ops_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: ビルド
        run: npm run build
      - name: 画面テスト
        run: npm run test:e2e
      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Docker: イメージを作って起動し、ログイン画面とログインを確かめる
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: イメージを作って起動する(DB・マイグレーション・デモデータ込み)
        run: docker compose up -d --build
      - name: 起動を待つ
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/login; then echo "起動しました"; exit 0; fi
            sleep 2
          done
          echo "起動しませんでした"; exit 1
      - name: ログイン画面とログインを確かめる
        run: |
          curl -fsS http://localhost:3000/login | grep -q "観光手配案件管理"
          curl -fsS -X POST http://localhost:3000/api/auth/sign-in/email \
            -H "Content-Type: application/json" -H "Origin: http://localhost:3000" \
            -d '{"email":"admin@tour-ops.example","password":"tour-ops-demo"}' | grep -q '"token"'
      - name: 失敗したときのログ
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
